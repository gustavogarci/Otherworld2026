name: Sync data files from upstream

# Pulls just the data files (events.json, map data, etc.) from
# Isaiiaas/OtherworldWWW on a schedule. Never touches index.html,
# vercel.json, .vercelignore, or any source files — this fork has
# diverged on UI/config and we want to keep that divergence.
#
# Vercel auto-deploys on every push to master, so a successful sync
# here triggers a fresh deploy of the mirror within ~60 seconds.

on:
  schedule:
    # Hourly, on the hour. Upstream's own sheet reconcile runs hourly
    # too, so polling more often than this almost never finds new data.
    - cron: "0 * * * *"
  # Manual trigger from the Actions tab — useful for the first run and
  # for forcing a refresh on demand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with sync-music-data.yml so the two data syncs serialize and
  # never race each other's push to master.
  group: sync-data
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history so git checkout from upstream/master works.
          fetch-depth: 0

      - name: Add upstream remote
        run: git remote add upstream https://github.com/Isaiiaas/OtherworldWWW.git

      - name: Fetch upstream
        run: git fetch upstream master

      - name: Pull data files only (never source)
        # Allowlist of files to mirror. Iterate one at a time so a single
        # missing file (e.g. upstream renames or deletes one) doesn't
        # atomically abort the whole checkout. Note: map.webp is NOT on
        # this list because upstream tracks map.png while this fork has
        # diverged to its own optimised webp; the map image rarely
        # changes anyway and is regenerated locally when it does.
        run: |
          for f in events.json data.js camp-aliases.json \
                   map-data.js map-locations.json map-labels.json; do
            if git cat-file -e "upstream/master:$f" 2>/dev/null; then
              git checkout upstream/master -- "$f"
              echo "  pulled: $f"
            else
              echo "  skipped (not in upstream): $f"
            fi
          done

      - name: Patch map-data.js to reference our webp (not upstream's png)
        # Upstream ships map.png; this fork ships an optimised map.webp.
        # The pin coordinates are calibrated to the same source PDF so
        # they line up perfectly — we just need to swap the filename
        # reference. Without this, the map view would 404 on the image
        # after every sync. Idempotent: no-op if already webp.
        run: |
          if [[ -f map-data.js ]]; then
            sed -i 's/"imagePath":"map\.png"/"imagePath":"map.webp"/g' map-data.js
            echo "  patched map.png -> map.webp in map-data.js"
          fi

      - name: Commit and push if changed
        run: |
          git config user.name  "Data Sync"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add -A
            git commit -m "Auto sync data from upstream ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          else
            echo "No upstream data changes."
          fi
