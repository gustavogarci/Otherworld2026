name: Sync music data from Dancing Decibels

# Regenerates music.json from the live Dancing Decibels event JSON, which
# is updated continuously upstream. The published feed does NOT send a CORS
# header, so the browser can't fetch it directly — we pull it here, run the
# same scripts/build-music.js transform we'd run locally, and commit the
# result. Vercel auto-deploys on every push to master, so a successful sync
# ships within ~60 seconds.
#
# Safety: the served file (music.json) keeps the exact same shape, so the
# app, the service worker, and existing users' favorites are untouched. A
# bad/empty/unreachable feed never overwrites the working music.json — the
# validation guards below abort the run instead, leaving the last-good copy
# committed as the fallback.

on:
  schedule:
    # Every ~15 minutes. GitHub may delay or skip scheduled runs under load,
    # so treat this as "roughly every 15-20 min". The commit step is gated on
    # a real diff, so quiet periods cost nothing.
    - cron: "*/15 * * * *"
  # Manual trigger from the Actions tab — useful for the first run and for
  # forcing a refresh on demand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with sync-upstream-data.yml so the two data syncs serialize and
  # never race each other's push to master.
  group: sync-data
  cancel-in-progress: false

env:
  # Live event feed (public data). The fbclid tracking param is intentionally
  # dropped. Override via a repo variable if the event/URL ever rotates.
  MUSIC_DATA_URL: "https://eventdata.dancingdecibels.com/EID-b3d48645-068c-4a87-9f48-7bdc807b7f00.json"
  # Floor below which we assume the feed is broken/partial and refuse to
  # overwrite the committed music.json.
  MIN_PERFORMANCES: "100"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download live event JSON
        # --fail: non-2xx exits non-zero (don't write garbage on a 4xx/5xx).
        # Cache-buster query param defeats the feed's max-age=31536000 CDN
        # caching so we always pull the current origin copy.
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            -H "Cache-Control: no-cache" \
            "${MUSIC_DATA_URL}?t=$(date +%s)" \
            -o /tmp/music-raw.json
          echo "Downloaded $(wc -c < /tmp/music-raw.json) bytes"

      - name: Validate feed before building
        # Refuse to proceed unless the feed parses and carries a plausible
        # number of performances. Aborting here keeps the last-good
        # music.json in place.
        run: |
          node -e '
            const fs = require("fs");
            let data;
            try {
              data = JSON.parse(fs.readFileSync("/tmp/music-raw.json", "utf8"));
            } catch (e) {
              console.error("Feed is not valid JSON:", e.message);
              process.exit(1);
            }
            const list = Array.isArray(data.artistPerformanceList) ? data.artistPerformanceList : [];
            const min = Number(process.env.MIN_PERFORMANCES || "100");
            console.log("artistPerformanceList length:", list.length, "(min:", min + ")");
            if (list.length < min) {
              console.error("Too few performances — refusing to overwrite music.json.");
              process.exit(1);
            }
          '

      - name: Build music.json from the feed
        # Reuse the exact transform we run locally. Output to a temp file
        # first, re-validate eventCount, then move into place — so a build
        # that somehow produces an empty result can't clobber the good copy.
        run: |
          node scripts/build-music.js /tmp/music-raw.json /tmp/music-built.json
          node -e '
            const fs = require("fs");
            const out = JSON.parse(fs.readFileSync("/tmp/music-built.json", "utf8"));
            const count = out && out.metadata && out.metadata.eventCount;
            console.log("Built eventCount:", count);
            if (!count || count <= 0) {
              console.error("Build produced no events — refusing to overwrite music.json.");
              process.exit(1);
            }
          '
          mv /tmp/music-built.json music.json

      - name: Commit and push if changed
        run: |
          git config user.name  "Data Sync"
          git config user.email "actions@users.noreply.github.com"
          if [[ -n "$(git status --porcelain music.json)" ]]; then
            git add music.json
            git commit -m "Auto sync music data from Dancing Decibels ($(date -u +%Y-%m-%dT%H:%MZ))"
            # Rebase on any concurrent push (e.g. the upstream data sync)
            # before pushing, to avoid a non-fast-forward rejection.
            git fetch origin master
            git rebase origin/master
            git push
          else
            echo "No music data changes."
          fi
